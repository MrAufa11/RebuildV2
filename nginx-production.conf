# ============================================
# NGINX CONFIGURATION FOR PRODUCTION
# ============================================
# This config hides backend API while serving images securely
# Place this in: /etc/nginx/sites-available/yoursite.com
# ============================================

server {
    listen 80;
    server_name yoursite.com www.yoursite.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yoursite.com www.yoursite.com;
    
    # SSL Configuration (use Let's Encrypt or your cert)
    ssl_certificate /etc/letsencrypt/live/yoursite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yoursite.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # ============================================
    # FRONTEND (Vue.js build)
    # ============================================
    root /home/username/public_html;
    index index.html;
    
    # Serve static frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # ============================================
    # IMAGES - Serve directly via Nginx (FAST!)
    # ============================================
    # Images are stored outside public_html but accessible via Nginx
    location /images/ {
        # Alias to backend uploads directory
        alias /home/username/backend/uploads/website/;
        
        # Security: Only allow image files
        location ~* \.(jpg|jpeg|png|gif|webp|svg)$ {
            # Cache images for 1 year
            add_header Cache-Control "public, max-age=31536000";
            add_header X-Content-Type-Options "nosniff";
            
            # Optional: Prevent hotlinking
            # valid_referers none blocked yoursite.com www.yoursite.com;
            # if ($invalid_referer) { return 403; }
            
            # Serve file
            try_files $uri =404;
        }
        
        # Block all other file types
        location ~ \.(php|html|js|css|exe|sh|bat)$ {
            deny all;
            return 403;
        }
    }
    
    # ============================================
    # BACKEND API - Proxy to Express
    # ============================================
    # Backend runs on port 3000 (hidden, not exposed to public)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Optional: Rate limiting for API
        # limit_req zone=api_limit burst=20 nodelay;
    }
    
    # ============================================
    # BLOCK DIRECT ACCESS TO SENSITIVE PATHS
    # ============================================
    
    # Block access to backend directory
    location ~ ^/backend/ {
        deny all;
        return 403;
    }
    
    # Block access to .env, .git, etc
    location ~ /\. {
        deny all;
        return 403;
    }
    
    # Block access to node_modules
    location ~ /node_modules/ {
        deny all;
        return 403;
    }
    
    # ============================================
    # LOGGING
    # ============================================
    access_log /var/log/nginx/yoursite.com.access.log;
    error_log /var/log/nginx/yoursite.com.error.log;
}

# ============================================
# RATE LIMITING (Optional)
# ============================================
# Add this in http {} block in /etc/nginx/nginx.conf:
#
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=image_limit:10m rate=50r/s;
# ============================================
